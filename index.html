<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4DAE2B">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CropKing">
<title>CropKing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --sky-1: #6FBDEB; --sky-2: #F6E7C8; --grass: #B7C451; --grass-2: #98A63E;
  --surface: #FFFFFF; --surface-2: #FFF6DA; --ink: #2D2A1F; --muted: #7A6F55;
  --line: #F0DFAE; --edge: #E3C77A;
  --soil: #A86A43; --soil-2: #8A5233;
  --green: #5BC236; --green-d: #3D9420; --orange: #FF9F1C; --orange-d: #D27800;
  --gold: #FFD23F; --gold-d: #E0A800; --gold-ink: #5A3D00;
  --red: #FF5A4E; --red-d: #C9362C; --blue: #3BA7F0; --blue-d: #1F7FC4;
  --bar: #4DAE2B; --bar-d: #37861B;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-1: #26345C; --sky-2: #7A5468; --grass: #5C6328; --grass-2: #474D1E;
    --surface: #3D3026; --surface-2: #4C3D30; --ink: #FFF3E0; --muted: #D2BE9E;
    --line: #5E4A38; --edge: #7A6048; --soil: #7A4A30; --soil-2: #613823;
    --gold-ink: #3B2800; --bar: #3D8424; --bar-d: #285A16; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky-1: #26345C; --sky-2: #7A5468; --grass: #5C6328; --grass-2: #474D1E;
  --surface: #3D3026; --surface-2: #4C3D30; --ink: #FFF3E0; --muted: #D2BE9E;
  --line: #5E4A38; --edge: #7A6048; --soil: #7A4A30; --soil-2: #613823;
  --gold-ink: #3B2800; --bar: #3D8424; --bar-d: #285A16; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100%; color: var(--ink);
  font: 700 16px/1.4 "Nunito", "Trebuchet MS", system-ui, sans-serif;
  background: linear-gradient(180deg, var(--sky-1), var(--sky-2) 55%, var(--grass) 55.1%, var(--grass-2));
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bar);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--blue); outline-offset: 2px; }
.display { font-weight: 900; }

/* ── шапка ── */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); border-bottom: 5px solid var(--bar-d); }
.top-in { max-width: 760px; margin: 0 auto; padding: 8px 14px; display: flex; align-items: center; gap: 10px; }
.logo { width: 46px; height: 46px; border-radius: 50%; flex: none; border: 3px solid #fff; box-shadow: 0 3px 0 var(--bar-d); }
.brand { font-size: 17px; font-weight: 900; color: #fff; line-height: 1.1; text-shadow: 0 2px 0 var(--bar-d); }
.lvl { font-size: 13px; color: #fff; display: flex; align-items: center; gap: 6px; margin-top: 4px; font-weight: 800; }
#lvlText { white-space: nowrap; background: var(--blue); border: 2px solid #fff; border-radius: 999px; padding: 0 8px; }
.xpbar { width: 76px; height: 10px; border-radius: 5px; background: rgba(0,0,0,.25); overflow: hidden; border: 2px solid #fff; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, #7DF0FF, #3BA7F0); transition: width .4s; }
.coins {
  margin-left: auto; display: flex; align-items: center; gap: 4px;
  background: var(--gold); color: var(--gold-ink); padding: 5px 12px; border-radius: 999px;
  border: 3px solid #fff; box-shadow: 0 3px 0 var(--gold-d);
  font-weight: 900; font-size: 17px; font-variant-numeric: tabular-nums;
}
.bonus {
  flex: none; width: 44px; height: 44px; border-radius: 14px; border: 3px solid #fff;
  background: var(--orange); box-shadow: 0 3px 0 var(--orange-d); font-size: 22px; position: relative; padding: 0;
}
.bonus.ready { animation: wiggle 2s ease-in-out infinite; }
.bonus.ready::after {
  content: "!"; position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; line-height: 16px;
  border-radius: 50%; background: var(--red); color: #fff; font-size: 13px; font-weight: 900; border: 2px solid #fff;
}
@keyframes wiggle { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-12deg); } 90% { transform: rotate(12deg); } 95% { transform: rotate(-6deg); } }
.pop { animation: pop .6s ease; }
@keyframes pop { 40% { transform: scale(1.3) rotate(-4deg); } }

/* ── основное ── */
main { max-width: 760px; margin: 0 auto; padding: 16px 14px 120px; }
h2 {
  display: inline-block; margin: 0; font-size: 22px; font-weight: 900; color: #fff;
  background: var(--orange); border: 3px solid #fff; border-radius: 14px; padding: 4px 16px;
  box-shadow: 0 4px 0 var(--orange-d); transform: rotate(-1.5deg);
}
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.sub { font-size: 14px; background: var(--surface); border-radius: 999px; padding: 3px 12px; border: 2px solid var(--edge); }
.hint {
  font-size: 14px; margin: 0 0 14px; background: var(--surface); border: 3px solid var(--edge);
  border-radius: 16px; padding: 10px 14px; position: relative; font-weight: 700;
}
.hint::before { content: "👨‍🌾"; float: left; font-size: 26px; margin: -2px 10px 0 0; }

.btn {
  border: 3px solid rgba(255,255,255,.9); border-radius: 16px; padding: 10px 14px; font-weight: 900; font-size: 15px;
  background: var(--surface); box-shadow: 0 5px 0 var(--edge); color: var(--ink);
  transition: transform .06s, box-shadow .06s;
}
.btn.primary { background: var(--green); color: #fff; box-shadow: 0 5px 0 var(--green-d); text-shadow: 0 2px 0 var(--green-d); }
.btn.gold { background: var(--gold); color: var(--gold-ink); box-shadow: 0 5px 0 var(--gold-d); }
.btn.blue { background: var(--blue); color: #fff; box-shadow: 0 5px 0 var(--blue-d); text-shadow: 0 2px 0 var(--blue-d); }
.btn:disabled { filter: grayscale(.85); opacity: .55; cursor: not-allowed; }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--edge); }
.btn.primary:active:not(:disabled) { box-shadow: 0 1px 0 var(--green-d); }
.btn.gold:active:not(:disabled) { box-shadow: 0 1px 0 var(--gold-d); }
.btn.blue:active:not(:disabled) { box-shadow: 0 1px 0 var(--blue-d); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1 1 140px; }

/* ── семена ── */
.seeds { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 12px; margin: 0 -2px 4px; scrollbar-width: none; }
.seeds::-webkit-scrollbar { display: none; }
.seed {
  flex: none; text-align: center; border: 3px solid var(--edge); background: var(--surface);
  border-radius: 18px; padding: 8px 12px 10px; min-width: 100px; line-height: 1.2; box-shadow: 0 4px 0 var(--edge);
}
.seed .em { display: block; font-size: 32px; line-height: 1.1; margin-bottom: 2px; }
.seed b { display: block; font-weight: 900; font-size: 14px; }
.seed small { color: var(--muted); font-size: 12px; font-weight: 800; }
.seed.on { border-color: var(--green); background: #EAFBD9; box-shadow: 0 4px 0 var(--green-d); transform: translateY(-3px); }
:root[data-theme="dark"] .seed.on { background: #2E4A2A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seed.on { background: #2E4A2A; } }
.seed:disabled { opacity: .55; filter: grayscale(.7); }

/* ── грядки ── */
.plots {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px;
  background: var(--grass-2); padding: 12px; border-radius: 22px; border: 4px solid #fff;
  box-shadow: 0 5px 0 rgba(0,0,0,.15), inset 0 0 0 3px rgba(0,0,0,.06);
}
@media (min-width: 560px) { .plots { grid-template-columns: repeat(4, 1fr); } }
.plot {
  --p: 0; position: relative; aspect-ratio: 1; border: 0; border-radius: 16px; padding: 0; overflow: hidden;
  background:
    repeating-linear-gradient(180deg, transparent 0 13px, rgba(0,0,0,.14) 13px 17px),
    linear-gradient(180deg, var(--soil), var(--soil-2));
  box-shadow: inset 0 -6px 0 rgba(0,0,0,.2), 0 4px 0 rgba(0,0,0,.2);
  display: grid; place-items: center;
}
.plot .crop {
  font-size: 46px; line-height: 1; transform: scale(calc(.45 + .55 * var(--p)));
  transition: transform .9s ease; filter: drop-shadow(0 3px 0 rgba(0,0,0,.3));
}
.plot .tag, .animal .tag {
  position: absolute; left: 6px; right: 6px; bottom: 6px; padding: 2px 6px; border-radius: 10px;
  background: rgba(30, 18, 8, .6); color: #fff; font-size: 13px; font-weight: 900;
  font-variant-numeric: tabular-nums; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.plot .bar, .animal .bar { position: absolute; left: 0; top: 0; height: 6px; width: calc(var(--p) * 100%); background: linear-gradient(90deg, #FFE45C, #FFB21C); transition: width .9s linear; }
.plot.empty .tag { background: transparent; color: rgba(255,255,255,.7); }
.plot.ready { box-shadow: inset 0 0 0 4px var(--gold), inset 0 -6px 0 rgba(0,0,0,.2), 0 4px 0 rgba(0,0,0,.2); }
.plot.ready .tag { background: var(--gold); color: var(--gold-ink); }
.plot.ready .crop { animation: bob 1.2s ease-in-out infinite; }
.plot.ready::after { content: "✨"; position: absolute; top: 6px; right: 6px; font-size: 16px; animation: twinkle 1.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px) scale(1.05); } }
@keyframes twinkle { 50% { opacity: .3; transform: scale(.7); } }
.plot.buy {
  background: rgba(255,255,255,.25); border: 3px dashed #fff; box-shadow: none; color: #fff;
  font-size: 13px; font-weight: 900; line-height: 1.3; text-align: center; padding: 8px; text-shadow: 0 1px 0 rgba(0,0,0,.3);
}
.plot.buy span { display: block; font-size: 30px; }

/* ── панели ── */
.list { display: grid; gap: 12px; }
.card { background: var(--surface); border: 3px solid var(--edge); border-radius: 20px; padding: 14px; box-shadow: 0 5px 0 var(--edge); }
.card.locked { opacity: .7; filter: grayscale(.5); }
.fac-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.fac-ico { font-size: 32px; width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(180deg, #8FD8FF, #C9F0FF); border: 3px solid #fff; box-shadow: 0 3px 0 var(--edge); display: grid; place-items: center; flex: none; }
.fac-name { font-weight: 900; font-size: 17px; }
.fac-meta { font-size: 13px; color: var(--muted); }
.recipe { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14px; margin-bottom: 12px; font-weight: 900; }
.chip { background: var(--surface-2); border: 2px solid var(--edge); border-radius: 999px; padding: 2px 10px; font-variant-numeric: tabular-nums; }
.chip small { font-weight: 700; color: var(--muted); }
.chip.short { border-color: var(--red); }
.status { font-size: 14px; font-weight: 900; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
.status.done { color: var(--green-d); }
.prog { height: 14px; border-radius: 8px; background: var(--surface-2); border: 2px solid var(--edge); overflow: hidden; margin: -2px 0 12px; }
.prog i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, #FFB21C 0 8px, #FFD23F 8px 16px); transition: width .9s linear; }

.item { display: flex; align-items: center; gap: 12px; }
.item .em { font-size: 34px; width: 52px; height: 52px; border-radius: 16px; background: var(--surface-2); display: grid; place-items: center; flex: none; }
.item .info { flex: 1; min-width: 0; }
.item .name { font-weight: 900; }
.item .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qty { font-weight: 900; font-size: 22px; font-variant-numeric: tabular-nums; }
.total { margin-top: 14px; display: flex; justify-content: space-between; align-items: center; font-weight: 900; background: var(--gold); color: var(--gold-ink); border: 3px solid #fff; border-radius: 18px; padding: 10px 16px; box-shadow: 0 5px 0 var(--gold-d); }
.total .qty { font-size: 20px; }
.empty-note { text-align: center; padding: 26px 16px; }
.empty-note .big { font-size: 48px; display: block; margin-bottom: 6px; }

/* ── рынок-ярмарка ── */
.stalls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 560px) { .stalls { grid-template-columns: repeat(3, 1fr); } }
.stall { position: relative; background: var(--surface); border: 3px solid var(--edge); border-radius: 20px; padding: 0 10px 12px; text-align: center; box-shadow: 0 5px 0 var(--edge); overflow: hidden; display: flex; flex-direction: column; }
.awning { height: 18px; margin: 0 -10px 8px; background: repeating-linear-gradient(90deg, var(--red) 0 18px, #fff 18px 36px); border-bottom: 3px solid var(--red-d); border-radius: 0 0 50% 50% / 0 0 100% 100%; }
.stall .em { font-size: 42px; line-height: 1.1; }
.stall .nm { font-weight: 900; font-size: 15px; }
.tagp { display: inline-block; margin: 6px auto 4px; background: var(--gold); color: var(--gold-ink); font-weight: 900; font-size: 18px; padding: 2px 12px 2px 18px; border-radius: 6px 12px 12px 6px; position: relative; box-shadow: 0 3px 0 var(--gold-d); font-variant-numeric: tabular-nums; }
.tagp::before { content: ""; position: absolute; left: 6px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: #fff; }
.mood { font-size: 12px; font-weight: 900; border-radius: 999px; padding: 2px 8px; display: inline-block; margin: 0 auto 8px; }
.mood.hot { background: #FFE0DC; color: #B42318; }
.mood.ok { background: #E6F6FF; color: #1C6EA4; }
.mood.cold { background: #EEE9FF; color: #5B45B8; }
.stall .have { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.stall .btn { margin-top: auto; font-size: 13px; padding: 8px 6px; }
.clock { font-size: 13px; font-variant-numeric: tabular-nums; background: var(--surface); border: 2px solid var(--edge); border-radius: 999px; padding: 3px 10px; }

/* ── рейтинг ── */
.lb { display: grid; gap: 8px; }
.lb-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: var(--surface); border: 3px solid var(--edge); box-shadow: 0 4px 0 var(--edge); }
.lb-row.me { border-color: var(--green); box-shadow: 0 4px 0 var(--green-d); }
.lb-pos { width: 30px; text-align: center; font-weight: 900; font-size: 18px; }
.lb-av { width: 32px; height: 32px; border-radius: 50%; flex: none; border: 2px solid var(--edge); }
.lb-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 900; }
.lb-coins { font-weight: 900; font-variant-numeric: tabular-nums; font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 14px 0 20px; }
.stat { border: 3px solid #fff; border-radius: 18px; padding: 10px 12px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.2); }
.stat:nth-child(1) { background: var(--blue); box-shadow: 0 5px 0 var(--blue-d); }
.stat:nth-child(2) { background: var(--orange); box-shadow: 0 5px 0 var(--orange-d); }
.stat:nth-child(3) { background: #B86B3E; box-shadow: 0 5px 0 #8A4C27; }
.stat:nth-child(4) { background: #9B5DE5; box-shadow: 0 5px 0 #7039B5; }
.stat b { display: block; font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; }
h3 { font-size: 17px; font-weight: 900; margin: 0 0 10px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.danger { margin-top: 26px; width: 100%; background: var(--surface); color: var(--red-d); }

/* ── нижнее меню ── */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: #8A5233; border-top: 5px solid #6B3C22; padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; padding: 6px 4px 8px; }
.tab { background: rgba(0,0,0,.15); border: 0; border-radius: 14px; padding: 5px 2px 6px; font-size: 10px; font-weight: 900; color: #FFE9CF; letter-spacing: -.2px; display: grid; justify-items: center; gap: 1px; position: relative; }
.tab .ti { font-size: 22px; line-height: 1.1; }
.tab.on { background: var(--gold); color: var(--gold-ink); box-shadow: 0 4px 0 var(--gold-d); transform: translateY(-6px); }
.tab .dot { position: absolute; top: -4px; right: calc(50% - 22px); width: 14px; height: 14px; border-radius: 50%; background: var(--red); border: 2px solid #fff; }

/* ── всплывашки ── */
.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  transform: translate(-50%, 20px) scale(.9); opacity: 0; pointer-events: none;
  background: #fff; color: #2D2A1F; padding: 10px 18px; border-radius: 18px; border: 3px solid var(--green);
  box-shadow: 0 5px 0 var(--green-d);
  font-weight: 900; font-size: 15px; max-width: calc(100% - 32px); width: max-content; text-align: center;
  transition: opacity .2s, transform .25s cubic-bezier(.3, 1.6, .5, 1);
}
.toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
.toast.err { border-color: var(--red); box-shadow: 0 5px 0 var(--red-d); }
.toast.lvl { background: var(--gold); color: var(--gold-ink); border-color: #fff; box-shadow: 0 5px 0 var(--gold-d); font-size: 17px; }


@media (max-width: 420px) { .brand { display: none; } .lvl { flex-direction: column; align-items: stretch; gap: 4px; margin: 0; } .xpbar { width: auto; height: 8px; } .coins { font-size: 15px; padding: 4px 10px; } .top-in { gap: 8px; } }
/* ── события, жуки, животные, задания ── */
.event { display: flex; align-items: center; gap: 10px; background: linear-gradient(90deg, #7B5CFF, #C25CFF); color: #fff; border: 3px solid #fff; border-radius: 18px; padding: 8px 12px; margin-bottom: 14px; box-shadow: 0 5px 0 #5B3CCB; font-size: 13px; line-height: 1.3; }
.event .ee { font-size: 30px; flex: none; }
.event b { display: block; font-size: 15px; font-weight: 900; }
.event small { margin-left: auto; flex: none; font-variant-numeric: tabular-nums; background: rgba(0,0,0,.22); border-radius: 999px; padding: 2px 8px; font-size: 12px; }
.plot .pest { position: absolute; top: 10px; left: 8px; font-size: 26px; animation: crawl .9s ease-in-out infinite; }
@keyframes crawl { 50% { transform: translate(8px, 4px) rotate(18deg); } }
.plot.bug { box-shadow: inset 0 0 0 4px var(--red), inset 0 -6px 0 rgba(0,0,0,.2), 0 4px 0 rgba(0,0,0,.2); }
.plot.bug .tag { background: var(--red); color: #fff; }
.pen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0 12px; }
@media (min-width: 560px) { .pen { grid-template-columns: repeat(6, 1fr); } }
.animal { position: relative; aspect-ratio: 1; border: 3px solid #fff; border-radius: 16px; padding: 0; overflow: hidden; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 120%, #C9A26B 0 35%, transparent 36%), var(--grass); box-shadow: 0 4px 0 var(--grass-2); }
.animal .ae { font-size: 40px; line-height: 1; filter: drop-shadow(0 3px 0 rgba(0,0,0,.2)); }
.animal.hungry .ae { animation: sad 2.4s ease-in-out infinite; }
.animal.hungry .tag { background: var(--orange); }
.animal.working .ae { animation: chew 1.4s ease-in-out infinite; }
.animal.ready { border-color: var(--gold); }
.animal.ready .tag { background: var(--gold); color: var(--gold-ink); }
.animal.ready .ae { animation: bob 1.2s ease-in-out infinite; }
@keyframes sad { 50% { transform: rotate(-8deg); } }
@keyframes chew { 50% { transform: scale(1.06, .94); } }
.h3row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 20px 0 10px; }
.h3row h3 { margin: 0; }
.quest .qtext { font-weight: 900; margin-bottom: 8px; }
.quest .prog { margin: 0 0 8px; }
.quest.claimed { opacity: .6; }
.qrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.reward { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qrow .btn { flex: none; padding: 7px 14px; font-size: 14px; }

.btn.big { font-size: 19px; padding: 14px 16px; }
.btn.plain { background: var(--surface-2); color: var(--muted); box-shadow: 0 5px 0 var(--edge); }
.ov { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; background: var(--sky-2);

.pond-scene { position: absolute; inset: 0; display: flex; flex-direction: column; }

.duck { position: absolute; bottom: -4px; left: 30%; font-size: 30px; animation: swim 9s ease-in-out infinite alternate; }
@keyframes swim { to { left: 60%; } }
.pond-water { flex: 1; position: relative; overflow: hidden;
  background: repeating-linear-gradient(180deg, transparent 0 38px, rgba(255,255,255,.08) 38px 41px), linear-gradient(#3BA7F0, #1D64AC); }
.lily { position: absolute; left: 12%; top: 52%; font-size: 34px; opacity: .9; }

  background: linear-gradient(#FF5A4E 50%, #fff 50%); border: 3px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.25); display: none; }

.au-row { display: flex; gap: 8px; flex-wrap: wrap; }

.au-pill.tok { background: #7A3A12; box-shadow: 0 3px 0 #4E220A; }
.barcard { border-color: #F0C27A; box-shadow: 0 5px 0 #D79B44; }
.bar-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }

.aubar { position: relative; height: 22px; border-radius: 12px; background: var(--surface-2); border: 3px solid #F0C27A; margin: 12px 26px 16px 4px; }

.mile { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 3px solid #F0C27A; display: grid; place-items: center; font-size: 14px; }
.mile.got { border-color: var(--green); }
.aubar .prize { position: absolute; right: -24px; top: 50%; transform: translateY(-50%); font-size: 40px; line-height: 0; filter: grayscale(.6) drop-shadow(0 2px 0 rgba(0,0,0,.2)); }

.mlist { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; font-weight: 900; margin-bottom: 8px; }
.bhint { display: block; font-size: 12px; color: var(--muted); font-weight: 700; line-height: 1.35; }
.digcard { border-color: #C98B4B; box-shadow: 0 5px 0 #9A6230; background: linear-gradient(#FFF6E6, #FFE9C7); color: #3A2A14; }
.aurules { margin: 0 0 12px; font-size: 14px; line-height: 1.4; }
.lgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 8px; border-radius: 16px; background: #6E8F2E; margin-bottom: 12px; }
.lp { position: relative; aspect-ratio: 1; border: 0; padding: 0; border-radius: 12px; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 70%, #D9822B, #A9531A); box-shadow: inset 0 -4px 0 rgba(0,0,0,.2), 0 3px 0 rgba(0,0,0,.2); font-size: 28px; touch-action: manipulation; }
.lp span { line-height: 1; filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
button.lp:active { transform: translateY(2px) scale(.96); }
.lp.open { background: #8C6B3F; box-shadow: inset 0 3px 6px rgba(0,0,0,.35); font-size: 24px; }
.lp.open > i { position: absolute; left: 3px; bottom: 1px; font-style: normal; font-size: 11px; font-weight: 900; color: #FFE7A3; }
.lp.open b { position: absolute; right: 4px; top: 1px; font-size: 13px; font-weight: 900; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.6); }
.lp.open b.n2 { color: #FFD23F; } .lp.open b.n3, .lp.open b.n4 { color: #FF8A7A; }
.lp.fresh span { animation: pop .4s ease; }
.lp.marked { background: #4F6A22; box-shadow: inset 0 0 0 3px #FFD23F; }
.lp.boom { background: #C9362C; }
.lp.ghost { opacity: .45; }
.lgrid.done { opacity: .95; }
.loot { text-align: center; font-size: 15px; margin-bottom: 10px; }
.aures { text-align: center; font-weight: 900; padding: 10px; border-radius: 14px; background: #fff; margin-bottom: 12px; line-height: 1.4; }
.aures.hog { background: #FFE0DC; } .aures.clear { background: #FFF3B8; }
.digcard .btn.big { width: 100%; }
.shop { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 560px) { .shop { grid-template-columns: repeat(3, 1fr); } }
.scard { color: #2D2A1F; border: 3px solid var(--edge); border-radius: 20px; padding: 12px 10px; text-align: center; display: flex; flex-direction: column; gap: 4px; }

.scard.au { background: linear-gradient(#FFFFFF, #FFF1DF); border-color: #F0C27A; box-shadow: 0 5px 0 #D79B44; }
.scard.au small { color: #8A5A2B; }
.btn.tok { background: var(--orange); color: #fff; box-shadow: 0 5px 0 var(--orange-d); text-shadow: 0 2px 0 var(--orange-d); }
.btn.tok:active:not(:disabled) { box-shadow: 0 1px 0 var(--orange-d); }
.seed.ev { border-color: #F0C27A; background: #FFF1DF; color: #3A2A14; box-shadow: 0 4px 0 #D79B44; }

.card.ev { border-color: #F0C27A; box-shadow: 0 5px 0 #D79B44; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface); border: 3px solid var(--edge); border-radius: 16px; padding: 5px; margin-bottom: 14px; }

/* ── деревня и коллекция ── */
.logo-btn { position: relative; flex: none; border: 0; background: none; padding: 0; border-radius: 50%; }

.vmap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 14px 10px; margin-bottom: 14px; border-radius: 22px; border: 4px solid #fff;
  background: linear-gradient(transparent 46%, #D9B27A 46%, #D9B27A 54%, transparent 54%), var(--grass-2); box-shadow: 0 5px 0 rgba(0,0,0,.15); }

.save .sdesc { margin: 0 0 6px; font-size: 14px; }

.savebox { width: 100%; margin: 12px 0; border: 3px solid var(--edge); border-radius: 14px; padding: 10px; font: 600 12px/1.35 ui-monospace, Menlo, Consolas, monospace;
  background: var(--surface-2); color: var(--ink); resize: vertical; word-break: break-all; }
.filebtn { display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }

/* ── нарисованные иконки ── */
#toast { display: block; }
#toast .ico { width: 1.25em; height: 1.25em; vertical-align: -0.28em; }
.ico { display: inline-block; width: 1em; height: 1em; vertical-align: -0.16em; line-height: 0; font-style: normal; }
.ico svg { width: 100%; height: 100%; display: block; overflow: visible; }
.chip .ico, .fac-meta .ico, .scard small .ico { width: 1.35em; height: 1.35em; vertical-align: -0.35em; }
.plot .crop .ico { width: 1.15em; height: 1.15em; }
.stall .em .ico, .seed .em .ico { width: 1.1em; height: 1.1em; }
.fac-ico .ico, .vtile .ve .ico, .ae .ico { width: 1.15em; height: 1.15em; }

/* ── осенний фон, листопад и украшения ── */
:root { --hill-1: #E3C46A; --hill-o: rgba(74, 46, 26, .25); --cloud: #FFFFFF; --cloud-o: rgba(74, 46, 26, .35); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --hill-1: #6A5A2A; --cloud: #5A5F86; --cloud-o: rgba(0,0,0,.3); } }
:root[data-theme="dark"] { --hill-1: #6A5A2A; --cloud: #5A5F86; --cloud-o: rgba(0,0,0,.3); }
.scene { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.sun { position: absolute; right: 7%; top: calc(env(safe-area-inset-top, 0px) + 92px); width: 66px; height: 66px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #FFF6B0, #FFD23F 60%, #F5B82E); border: 3px solid #E8A008;
  box-shadow: 0 0 0 12px rgba(255, 220, 90, .22), 0 0 0 26px rgba(255, 220, 90, .1); }
.moon, .stars { display: none; }
.cloud { position: absolute; width: 130px; animation: drift linear infinite; }
.cloud.c1 { top: calc(env(safe-area-inset-top, 0px) + 130px); animation-duration: 110s; animation-delay: -20s; }
.cloud.c2 { top: 32%; width: 96px; animation-duration: 140s; animation-delay: -80s; opacity: .9; }
@keyframes drift { from { transform: translateX(-160px); } to { transform: translateX(calc(100vw + 40px)); } }
.birds { position: absolute; top: 26%; width: 44px; animation: drift 80s linear infinite; animation-delay: -30s; }
.hills { position: absolute; left: -2px; right: -2px; width: calc(100% + 4px); top: calc(55% - 96px); height: 100px; }
.trees span { position: absolute; top: calc(55% - 30px); width: calc(60px * var(--s, 1)); transform: translate(-50%, -100%); }
.trees span svg { display: block; width: 100%; }
.meadow { position: absolute; left: 0; right: 0; top: 55%; bottom: 0;
  background-image:
    radial-gradient(ellipse 90px 22px at 18% 22%, rgba(255, 240, 170, .22), transparent 70%),
    radial-gradient(ellipse 120px 28px at 72% 44%, rgba(60, 70, 20, .12), transparent 70%),
    radial-gradient(ellipse 100px 24px at 30% 74%, rgba(60, 70, 20, .1), transparent 70%),
    radial-gradient(ellipse 80px 20px at 86% 82%, rgba(255, 240, 170, .2), transparent 70%),
    var(--deco-blades);
  background-size: auto, auto, auto, auto, 90px 66px; }
.meadow > span { position: absolute; }
.mi { display: block; font-size: var(--z); transform: rotate(var(--r)); line-height: 0; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .sun { display: none; }
  :root:not([data-theme="light"]) .moon { display: block; position: absolute; right: 8%; top: calc(env(safe-area-inset-top, 0px) + 92px); width: 54px; height: 54px; border-radius: 50%; background: #FFF3C4; box-shadow: inset -12px -6px 0 #E8D79A, 0 0 0 14px rgba(255, 243, 196, .12); }
  :root:not([data-theme="light"]) .stars { display: block; position: absolute; inset: 0 0 50% 0;
    background-image: radial-gradient(2px 2px at 12% 18%, #fff, transparent), radial-gradient(1.5px 1.5px at 30% 30%, #fff, transparent), radial-gradient(2px 2px at 52% 14%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 66% 36%, #fff, transparent), radial-gradient(2px 2px at 84% 26%, #fff, transparent), radial-gradient(1.5px 1.5px at 22% 42%, #fff, transparent); }
}
.leaves { position: fixed; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
.leaves > span { position: absolute; top: -40px; opacity: .95; animation-name: fall; animation-timing-function: linear; animation-iteration-count: 1; animation-fill-mode: forwards; }
.leaves > span > i { display: block; animation: sway ease-in-out infinite alternate; }
@keyframes fall { from { transform: translate(0, 0); } to { transform: translate(var(--dx, 0px), calc(100vh + 90px)); } }
@keyframes sway { from { transform: translateX(calc(var(--sw, 20px) * -1)) rotate(calc(var(--r0, 0deg) - 30deg)); } to { transform: translateX(var(--sw, 20px)) rotate(calc(var(--r0, 0deg) + 40deg)); } }
h2::after { content: ""; display: inline-block; width: 22px; height: 22px; margin-left: 6px; vertical-align: -3px; background: var(--deco-leaf) center / contain no-repeat; transform: rotate(-20deg); }
.plots::after { content: ""; position: absolute; right: -10px; bottom: -12px; width: 64px; height: 42px; background: var(--deco-pile) center / contain no-repeat; pointer-events: none; z-index: 1; }
.plots, .vmap { position: relative; }
.tabs::before { content: ""; position: absolute; left: 0; right: 0; top: -15px; height: 14px; background: var(--deco-tufts) repeat-x left bottom / 120px 14px; pointer-events: none; }
.au-banner .deco { right: 10px; top: 8px; font-size: 50px; }
/* рыбалка */
.pond-sky { height: 24%; min-height: 110px; border-bottom: 0; overflow: hidden; background: linear-gradient(#7FC3EC, #F6E7C8); }
.p-sun { position: absolute; right: 12%; top: 14px; width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #FFF6B0, #FFD23F 60%, #F5B82E); border: 3px solid #E8A008; box-shadow: 0 0 0 10px rgba(255, 220, 90, .25); }
.p-cloud { position: absolute; top: 16px; width: 96px; animation: drift 90s linear infinite; animation-delay: -25s; }
.p-hills { position: absolute; left: 0; bottom: 0; width: 100%; height: 56%; }
.p-tree { position: absolute; bottom: 22%; width: 34px; transform: translateX(-50%); }
.p-tree svg { display: block; width: 100%; }
.pond-bank { position: relative; z-index: 3; height: 14px; background: linear-gradient(#B7C451, #98A63E); border-top: 2px solid rgba(74,46,26,.35); border-bottom: 3px solid #7A8A2E; }
.pond-bank .cat { position: absolute; bottom: -34px; width: 74px; pointer-events: none; }
.pond-bank .cat.l { left: -6px; } .pond-bank .cat.r { right: -8px; transform: scaleX(-1); }
.pond-bank .cat svg { display: block; width: 100%; }
.pond-water { background: radial-gradient(ellipse at 50% 0, rgba(255,255,255,.18), transparent 40%), linear-gradient(#45B0F2, #1D64AC); }
.wave { position: absolute; left: 0; width: 200%; height: 10px; opacity: .4; animation: waves 9s linear infinite; background: var(--deco-wave) repeat-x left / 80px 10px; }
@keyframes waves { to { transform: translateX(-80px); } }
.duck { position: absolute; top: 10px; left: 30%; font-size: 38px; z-index: 2; animation: swim 16s ease-in-out infinite alternate; }
.duck > i { animation: bob 2s ease-in-out infinite; }
@keyframes swim { 0% { left: 18%; } 49% { transform: scaleX(1); } 50% { transform: scaleX(-1); left: 64%; } 99% { transform: scaleX(-1); } 100% { left: 18%; transform: scaleX(1); } }
.pad { position: absolute; width: 58px; pointer-events: none; }
.pad svg { display: block; width: 100%; }
.floatleaf { position: absolute; left: 0; font-size: 22px; animation: floatl linear infinite; }
.floatleaf .ico { transform: rotate(70deg); }
@keyframes floatl { from { transform: translateX(-40px) rotate(0); } to { transform: translateX(calc(100vw + 40px)) rotate(120deg); } }
.shadowfish { position: absolute; width: 46px; height: 16px; border-radius: 50%; background: rgba(10, 40, 80, .28); animation: shfish linear infinite; }
.shadowfish::after { content: ""; position: absolute; left: -10px; top: 2px; border-right: 12px solid rgba(10, 40, 80, .28); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
@keyframes shfish { from { transform: translateX(-80px); } to { transform: translateX(calc(100vw + 80px)); } }
.pier { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; pointer-events: none;
  background: repeating-linear-gradient(90deg, #B07A45 0 54px, #8B5A2B 54px 57px); border-top: 4px solid #6B4423; box-shadow: 0 -6px 0 rgba(0,0,0,.12); }
.pier::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 3px; background: rgba(74,46,26,.35); }
.fpanel { z-index: 2; }
.lily { display: none; }
.fmsg { top: 22%; }
.bobber { top: 36%; }
/* пары */
.pairs { background: radial-gradient(ellipse 120px 30px at 20% 20%, rgba(255,240,170,.22), transparent 70%), radial-gradient(ellipse 140px 34px at 78% 80%, rgba(60,70,20,.12), transparent 70%), var(--deco-blades), var(--grass); background-size: auto, auto, 90px 66px, auto; }
.pairs::after { content: ""; position: absolute; right: 8px; bottom: 8px; width: 96px; height: 64px; background: var(--deco-pile) center / contain no-repeat; pointer-events: none; }
/* ── проработка интерфейса ── */
:root { --hi: rgba(255,255,255,.6); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --hi: rgba(255,255,255,.08); } }
:root[data-theme="dark"] { --hi: rgba(255,255,255,.08); }
.card, .seed, .stall, .badge, .vhead, .sub, .clock { box-shadow: inset 0 2px 0 var(--hi), 0 5px 0 var(--edge); }
.sub, .clock { box-shadow: inset 0 1.5px 0 var(--hi), 0 2px 0 var(--edge); }
.btn { position: relative; overflow: hidden; }
.btn::before { content: ""; position: absolute; left: 6px; right: 6px; top: 2px; height: 42%; border-radius: 12px 12px 10px 10px;
  background: linear-gradient(rgba(255,255,255,.42), rgba(255,255,255,0)); pointer-events: none; }
.btn:disabled::before { opacity: .4; }
h2 { white-space: nowrap; flex: none; padding: 4px 22px; background-image: radial-gradient(circle at 10px 50%, #8A4A10 0 2.4px, transparent 3.4px),
  radial-gradient(circle at calc(100% - 10px) 50%, #8A4A10 0 2.4px, transparent 3.4px), linear-gradient(rgba(255,255,255,.3), rgba(255,255,255,0) 60%); }
.top { background-image: var(--deco-blades), linear-gradient(rgba(255,255,255,.08), rgba(0,0,0,.06)); background-size: 90px 66px, auto; }
.tabs { background: repeating-linear-gradient(90deg, transparent 0 62px, rgba(0,0,0,.2) 62px 64px), linear-gradient(#97603C, #7A4628); }
.tabs-in { background-image: radial-gradient(circle at 6px 6px, rgba(0,0,0,.35) 0 1.6px, transparent 2.4px); background-size: 64px 54px; }
.plots, .vmap { border: 5px solid #B07A45; box-shadow: inset 0 0 0 2px #D9A15B, 0 5px 0 #7A4A2A; }
.plots { background: var(--deco-blades), linear-gradient(var(--grass), var(--grass-2)); background-size: 90px 66px, auto; }
.plot { border: 3px solid #6E4026; background:
  radial-gradient(circle at 20% 30%, rgba(255,255,255,.2) 0 1.4px, transparent 2.4px),
  radial-gradient(circle at 70% 60%, rgba(0,0,0,.28) 0 1.8px, transparent 2.8px),
  radial-gradient(circle at 40% 80%, rgba(255,255,255,.16) 0 1.3px, transparent 2.3px),
  radial-gradient(circle at 85% 20%, rgba(0,0,0,.22) 0 1.4px, transparent 2.4px),
  repeating-linear-gradient(180deg, rgba(255,255,255,.08) 0 3px, transparent 3px 13px, rgba(0,0,0,.16) 13px 17px),
  linear-gradient(180deg, var(--soil), var(--soil-2));
  background-size: 26px 26px, 31px 31px, 23px 23px, 37px 37px, auto, auto; }
.plot.ready { border-color: #E3A008; }
.plot.bug { border-color: var(--red-d); }
.plot.ready::after { content: ""; width: 18px; height: 18px; background: var(--deco-spark) center / contain no-repeat; }
.plot .tag { box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
.plot .crop .ico svg, .seed .em .ico svg, .stall .em .ico svg, .fac-ico .ico svg, .ae .ico svg, .ve .ico svg, .scard .se .ico svg, .aitem:not(.unk) .ico svg, .gart .ico svg {
  filter: drop-shadow(0 2.5px 0 rgba(74, 46, 26, .22)); }
.fac-ico { box-shadow: inset 0 2px 0 rgba(255,255,255,.7), 0 3px 0 var(--edge); }
.stall { background: linear-gradient(var(--surface) 72%, var(--surface-2)); }
.stall .em { display: inline-block; margin-top: 2px; padding: 4px 10px 0; background: radial-gradient(ellipse at 50% 90%, rgba(74,46,26,.12), transparent 60%); }
.seed .em { background: radial-gradient(ellipse at 50% 92%, rgba(74,46,26,.12), transparent 62%); }
.vmap { background: radial-gradient(circle at 12% 50%, #C99E66 0 3px, transparent 4px), radial-gradient(circle at 37% 51%, #C99E66 0 2.5px, transparent 3.5px),
  radial-gradient(circle at 63% 49%, #C99E66 0 3px, transparent 4px), radial-gradient(circle at 88% 50%, #C99E66 0 2.5px, transparent 3.5px),
  linear-gradient(transparent 46%, #D9B27A 46%, #D9B27A 54%, transparent 54%), var(--deco-blades), linear-gradient(var(--grass), var(--grass-2));
  background-size: auto, auto, auto, auto, auto, 90px 66px, auto; }
.vtile { box-shadow: inset 0 2px 0 rgba(255,255,255,.4), 0 3px 0 rgba(0,0,0,.15); }
.animal { background: radial-gradient(circle at 50% 120%, #C9A26B 0 35%, transparent 36%), var(--deco-blades), linear-gradient(var(--grass), var(--grass-2)); background-size: auto, 90px 66px, auto; }

/* руины на карте деревни: без фильтров, чтобы не пропадали в Safari */
.vtile .ve { display: block; line-height: 1; }
.vtile.locked .ve { filter: none; opacity: .62; }
.vtile .ve .ico svg { filter: none; }

/* клад: значки нормального размера */
.lp span .ico { width: 1.3em; height: 1.3em; }
/* окно «Новое событие» */
.evpop { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 20px; background: rgba(30, 20, 10, .55);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); animation: evfade .35s ease both; }
.evpop.out { animation: evfadeout .3s ease forwards; pointer-events: none; }
.evcard { position: relative; width: min(100%, 380px); max-height: calc(100% - 20px); overflow: auto; background: var(--surface); color: var(--ink); border: 4px solid #fff; border-radius: 26px;
  box-shadow: 0 8px 0 rgba(0,0,0,.25); text-align: center; animation: evdrop .7s cubic-bezier(.25, 1.45, .5, 1) both; }
.evpop.out .evcard { animation: evcardout .3s ease forwards; }
@keyframes evfade { from { opacity: 0; } }
@keyframes evfadeout { to { opacity: 0; } }
@keyframes evdrop { 0% { transform: translateY(-80px) scale(.7) rotate(-4deg); opacity: 0; } 55% { opacity: 1; } 100% { transform: none; } }
@keyframes evcardout { to { transform: translateY(30px) scale(.85); opacity: 0; } }
.ev-art { position: relative; height: 214px; overflow: hidden; border-bottom: 4px solid #fff;
  background: radial-gradient(circle at 82% 20%, #FFE27A 0 22px, rgba(255, 226, 122, .32) 23px 40px, transparent 41px), linear-gradient(#F7D08A, #EE8E3A 68%, #C25A1C); }
.ev-rays { position: absolute; left: 50%; top: 64%; width: 360px; height: 360px; margin: -180px 0 0 -180px; border-radius: 50%; z-index: 1;
  background: repeating-conic-gradient(rgba(255, 255, 255, .32) 0 9deg, transparent 9deg 22deg);
  -webkit-mask-image: radial-gradient(circle, #000 18%, transparent 62%); mask-image: radial-gradient(circle, #000 18%, transparent 62%);
  animation: raysin .8s .3s ease both, spin 22s linear infinite; }
@keyframes raysin { from { opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
.ev-hill { position: absolute; left: 0; bottom: 0; width: 100%; height: 70px; z-index: 2; animation: hillup .6s .15s ease-out both; }
@keyframes hillup { from { transform: translateY(50px); } }
.ev-ribbon { position: absolute; left: 0; right: 0; margin: 0 auto; width: max-content; top: 14px; z-index: 4; white-space: nowrap;
  background: var(--red); color: #fff; font-weight: 900; font-size: 18px; padding: 5px 18px; border: 3px solid #fff; border-radius: 12px; box-shadow: 0 4px 0 var(--red-d); text-shadow: 0 2px 0 var(--red-d);
  animation: ribbonin .65s .25s cubic-bezier(.3, 1.7, .5, 1) both, ribbonwig 3.2s 1.3s ease-in-out infinite; }
@keyframes ribbonin { from { transform: scale(0) rotate(-30deg); } to { transform: scale(1) rotate(-3deg); } }
@keyframes ribbonwig { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(2deg) scale(1.05); } }
.ev-i { position: absolute; line-height: 0; z-index: 3; animation: evpopin .6s var(--d, .5s) cubic-bezier(.3, 1.5, .5, 1) both; }
@keyframes evpopin { 0% { transform: scale(0) rotate(calc(var(--rot, 0deg) - 45deg)); opacity: 0; } 70% { transform: scale(1.15) rotate(var(--rot, 0deg)); opacity: 1; } 100% { transform: scale(1) rotate(var(--rot, 0deg)); } }
.ev-i.a { left: calc(50% - 52px); bottom: 24px; font-size: 104px; --d: .45s; }
.ev-i.a .ico { animation: acornbob 2.2s 1.1s ease-in-out infinite; }
@keyframes acornbob { 50% { transform: translateY(-9px) rotate(4deg); } }
.ev-i.m { left: 6%; top: 54px; font-size: 54px; --rot: -18deg; --d: .55s; }
.ev-i.l { right: 7%; top: 72px; font-size: 44px; --rot: 20deg; --d: .65s; }
.ev-i.m .ico, .ev-i.l .ico { animation: leafsway 2.8s 1.2s ease-in-out infinite alternate; }
@keyframes leafsway { from { transform: rotate(-9deg); } to { transform: rotate(11deg) translateY(4px); } }
.ev-i.o { left: 31%; bottom: 8px; font-size: 30px; --rot: -60deg; --d: .8s; }
.ev-i.s { right: 12%; bottom: 14px; font-size: 42px; --d: .75s; }
.ev-i.s .ico { transform-origin: 50% 100%; animation: squish 2.6s 1.4s ease-in-out infinite; }
@keyframes squish { 0%, 80%, 100% { transform: none; } 86% { transform: scale(1.12, .86); } 93% { transform: scale(.94, 1.08); } }
.ev-i.h { left: 9%; bottom: 10px; font-size: 58px; animation: hogin .8s .85s cubic-bezier(.3, 1.3, .5, 1) both; }
@keyframes hogin { from { transform: translateX(-110px); opacity: 0; } }
.ev-i.h .ico { animation: hop 3s 1.8s ease-in-out infinite; }
@keyframes hop { 0%, 70%, 100% { transform: translateY(0); } 78% { transform: translateY(-12px) rotate(-6deg); } 86% { transform: translateY(0); } 92% { transform: translateY(-4px); } }
.ev-sp { position: absolute; z-index: 4; line-height: 0; font-size: 20px; opacity: 0; animation: twinkle 1.8s ease-in-out infinite; }
.ev-sp.s1 { left: 34%; top: 82px; animation-delay: 1.1s; } .ev-sp.s2 { left: 63%; top: 96px; font-size: 16px; animation-delay: 1.6s; } .ev-sp.s3 { left: 58%; top: 60px; font-size: 13px; animation-delay: 2.1s; }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.3) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
.ev-fall { position: absolute; top: -30px; font-size: 22px; line-height: 0; animation: evfall linear infinite; z-index: 2; }
.ev-fall.f1 { left: 22%; animation-duration: 6s; } .ev-fall.f2 { left: 66%; animation-duration: 7.5s; animation-delay: -3s; } .ev-fall.f3 { left: 88%; animation-duration: 5.5s; animation-delay: -1.5s; }
@keyframes evfall { 0% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(18px, 125px) rotate(140deg); } 100% { transform: translate(-6px, 250px) rotate(280deg); } }
.ev-x { position: absolute; top: 10px; right: 10px; z-index: 5; width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; background: var(--red); color: #fff;
  font-size: 18px; font-weight: 900; box-shadow: 0 3px 0 var(--red-d); padding: 0; animation: evpopin .5s .95s cubic-bezier(.3, 1.6, .5, 1) both; transition: transform .2s; }
.ev-x:active { transform: scale(.88) rotate(90deg); }
.ev-body { padding: 16px 18px 20px; }
.ev-body > * { animation: evrise .5s ease both; }
.ev-body > :nth-child(1) { animation-delay: .55s; } .ev-body > :nth-child(2) { animation-delay: .68s; } .ev-body > :nth-child(3) { animation-delay: .8s; }
@keyframes evrise { from { transform: translateY(16px); opacity: 0; } }
.evcard .ev-body h3 { color: var(--ink); text-shadow: none; font-size: 24px; margin: 0 0 6px; }
.ev-body p { margin: 0 0 12px; font-size: 15px; line-height: 1.4; }
.ev-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 16px; font-size: 13px; }
.ev-chips .chip { animation: evrise .45s ease both; } .ev-chips .chip:nth-child(1) { animation-delay: .85s; } .ev-chips .chip:nth-child(2) { animation-delay: .95s; } .ev-chips .chip:nth-child(3) { animation-delay: 1.05s; }
.ev-go { animation: evrise .5s 1s ease both, evpulse 1.8s 1.8s ease-in-out infinite !important; }
@keyframes evpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
.ev-go::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; pointer-events: none;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.65), transparent); transform: skewX(-20deg); animation: shine 2.8s 1.6s ease-in-out infinite; }
@keyframes shine { 0% { left: -60%; } 45%, 100% { left: 130%; } }
/* ── анимации ── */
#view.v-enter > * { animation: vIn .45s cubic-bezier(.25, 1.25, .5, 1) both; }
#view.v-enter > *:nth-child(2) { animation-delay: .05s; } #view.v-enter > *:nth-child(3) { animation-delay: .1s; }
#view.v-enter > *:nth-child(4) { animation-delay: .15s; } #view.v-enter > *:nth-child(5) { animation-delay: .2s; }
#view.v-enter > *:nth-child(n+6) { animation-delay: .25s; }
#view.v-enter .list > *, #view.v-enter .stalls > *, #view.v-enter .shop > *, #view.v-enter .plots > *, #view.v-enter .vmap > *, #view.v-enter .ach > *, #view.v-enter .seeds > * {
  animation: cardIn .45s cubic-bezier(.3, 1.4, .5, 1) both; }
#view.v-enter :is(.list, .stalls, .shop, .plots, .vmap, .ach, .seeds) > *:nth-child(2) { animation-delay: .12s; }
#view.v-enter :is(.list, .stalls, .shop, .plots, .vmap, .ach, .seeds) > *:nth-child(3) { animation-delay: .17s; }
#view.v-enter :is(.list, .stalls, .shop, .plots, .vmap, .ach, .seeds) > *:nth-child(4) { animation-delay: .22s; }
#view.v-enter :is(.list, .stalls, .shop, .plots, .vmap, .ach, .seeds) > *:nth-child(5) { animation-delay: .27s; }
#view.v-enter :is(.list, .stalls, .shop, .plots, .vmap, .ach, .seeds) > *:nth-child(6) { animation-delay: .32s; }
#view.v-enter :is(.list, .stalls, .shop, .plots, .vmap, .ach, .seeds) > *:nth-child(n+7) { animation-delay: .37s; }
#view.v-enter h2 { animation: signIn .6s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes vIn { from { opacity: 0; transform: translateY(18px); } }
@keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.9); } }
@keyframes signIn { 0% { opacity: 0; transform: rotate(-12deg) scale(.6); } 100% { transform: rotate(-1.5deg); } }
.tab.on .ti { animation: tabHop .5s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes tabHop { 0% { transform: translateY(0) scale(1); } 40% { transform: translateY(-7px) scale(1.25) rotate(-8deg); } 100% { transform: none; } }
.tap { animation: tapSquish .28s ease; }
@keyframes tapSquish { 30% { transform: scale(.92, .88); } 65% { transform: scale(1.05, 1.06); } }
.plot .crop.grow { animation: growPop .55s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes growPop { 0% { transform: scale(.2) translateY(14px); } 60% { transform: scale(1.25); } }
.plot.ready .crop { animation: readyBob 1.3s ease-in-out infinite; }
@keyframes readyBob { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-5px) rotate(-5deg); } 75% { transform: translateY(-3px) rotate(5deg); } }
#coins.gain { animation: coinGain .6s cubic-bezier(.3, 1.8, .5, 1); }
#coins.loss { animation: coinLoss .45s ease; }
@keyframes coinGain { 40% { transform: scale(1.22) rotate(-5deg); box-shadow: 0 0 0 8px rgba(255, 210, 63, .5), 0 3px 0 var(--gold-d); } }
@keyframes coinLoss { 25% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
.floater { position: fixed; z-index: 65; pointer-events: none; display: flex; align-items: center; gap: 3px; white-space: nowrap;
  font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 2px 0 rgba(74, 46, 26, .8), 0 0 6px rgba(74, 46, 26, .5);
  animation: floatUp 1.1s cubic-bezier(.2, .9, .3, 1) forwards; transform: translate(-50%, -50%); }
.floater .ico { width: 1.4em; height: 1.4em; filter: drop-shadow(0 2px 0 rgba(74, 46, 26, .4)); }
.floater.neg { color: #FFB3A8; }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.4); } 15% { opacity: 1; transform: translate(-50%, -70%) scale(1.2); }
  30% { transform: translate(-50%, -85%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -260%) scale(.9); } }
.flycoin { position: fixed; z-index: 66; pointer-events: none; width: 22px; height: 22px; line-height: 0; font-size: 22px; }
.burst { position: fixed; z-index: 66; pointer-events: none; width: 9px; height: 13px; border-radius: 2px; animation: burst 1.2s cubic-bezier(.2, .7, .4, 1) forwards; }
@keyframes burst { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(var(--bx), var(--by)) rotate(var(--br)); opacity: 0; } }
.toast.show { animation: toastIn .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes toastIn { 0% { transform: translate(-50%, 30px) scale(.6); } 100% { transform: translate(-50%, 0) scale(1); } }
.btn:not(:disabled):hover { filter: brightness(1.05); }
.btn.gold:not(:disabled), .btn.primary:not(:disabled) { transition: transform .08s, box-shadow .08s, filter .15s; }
.lp.open.fresh { animation: digOpen .4s ease; }
@keyframes digOpen { 0% { transform: scale(1.15) rotate(6deg); } 50% { transform: scale(.92) rotate(-3deg); } }
.lp.boom { animation: boom .5s ease; }
@keyframes boom { 20% { transform: scale(1.2); } 40% { transform: translateX(-4px) rotate(-6deg); } 60% { transform: translateX(4px) rotate(6deg); } }
.vtile.next .ve { animation: hopWait 2.2s ease-in-out infinite; }
@keyframes hopWait { 0%, 70%, 100% { transform: none; } 80% { transform: translateY(-5px); } 90% { transform: translateY(0) scale(1.05, .95); } }
.xpbar i { transition: width .7s cubic-bezier(.3, 1.4, .5, 1); }
.animal.ready .ae, .stall .em .ico { transition: transform .2s; }
.stall:active .em .ico { transform: scale(1.15) rotate(-6deg); }
/* фон: небо и трава рисуются неподвижной сценой (на iPhone фон body прокручивается) */
.scene { background: linear-gradient(180deg, var(--sky-1), var(--sky-2) 55%, var(--grass) 55%, var(--grass-2)); }
html { background: var(--grass-2); }
body { background: transparent !important; }

/* ── колесо удачи ── */
.wheelcard { text-align: center; border-color: #F0C27A; box-shadow: inset 0 2px 0 var(--hi), 0 5px 0 #D79B44; background: linear-gradient(#FFF8EA, #FFE9C7); color: #3A2A14; }
.wheel-wrap { position: relative; width: min(84vw, 300px); aspect-ratio: 1; margin: 18px auto 14px; }
.wheel-wrap::before { content: ""; position: absolute; inset: -12px; border-radius: 50%;
  background: repeating-conic-gradient(#FFF6C8 0 6deg, #FFD23F 6deg 15deg); border: 4px solid #8B5A2B; box-shadow: 0 6px 0 #6B4423, inset 0 0 0 3px #fff; }
.wheel-lights { position: absolute; inset: -12px; border-radius: 50%; pointer-events: none; z-index: 3; }
.wheel-lights i { position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px; border-radius: 50%; background: #FFF6C8; border: 1.5px solid #8B5A2B;
  animation: bulb 1s steps(1) infinite; }
.wheel-lights i:nth-child(odd) { animation-delay: .5s; }
.wheel-wrap.spin .wheel-lights i { animation-duration: .25s; }
@keyframes bulb { 50% { background: #E8423A; box-shadow: 0 0 8px #FF9F1C; } }
.wheel-svg { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; transform: rotate(var(--wr, 0deg)); z-index: 1;
  transition: transform 4.6s cubic-bezier(.12, .7, .14, 1); filter: drop-shadow(0 3px 0 rgba(74, 46, 26, .25)); }
.wheel-hub { position: absolute; left: 50%; top: 50%; width: 21%; aspect-ratio: 1; transform: translate(-50%, -50%); z-index: 2; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #FFF6B0, #FFD23F 60%, #E0A800); border: 4px solid #8B5A2B; display: grid; place-items: center; font-size: 24px; line-height: 0; }
.wheel-ptr { position: absolute; left: 50%; top: -24px; transform: translateX(-50%); z-index: 4; width: 40px; height: 46px; transform-origin: 50% 20%; }
.wheel-wrap.spin .wheel-ptr { animation: ptrTick .12s ease-in-out infinite alternate; }
@keyframes ptrTick { from { transform: translateX(-50%) rotate(-12deg); } to { transform: translateX(-50%) rotate(6deg); } }
.wheel-btns { display: grid; gap: 10px; }
.wheel-note { font-size: 13px; color: #8A5A2B; margin: 0 0 10px; }
.wprize-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 12px; font-size: 12px; }
.wprize-list .chip { background: #fff; }
.wheel-win { position: fixed; inset: 0; z-index: 68; display: grid; place-items: center; padding: 24px; background: rgba(30, 20, 10, .5); animation: evfade .3s ease both; }
.wheel-win .card { text-align: center; width: min(100%, 320px); border: 4px solid #fff; animation: evdrop .6s cubic-bezier(.25, 1.45, .5, 1) both; }
.wheel-win .wbig { font-size: 74px; line-height: 1; margin: 6px 0 4px; display: block; animation: winSpin .9s .2s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes winSpin { from { transform: scale(0) rotate(-180deg); } }
.wheel-win h4 { margin: 4px 0 6px; font-size: 22px; font-weight: 900; }
.wheel-win p { margin: 0 0 14px; }
.wheel-win.rare .card { background: linear-gradient(#FFF6C8, #FFE27A); }
.wheel-win.rare .wbig { filter: drop-shadow(0 0 14px #FFD23F); }
.wseg { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 20px; line-height: 1; }
.wseg .ico { width: 1.05em; height: 1.05em; }
.wseg b { font-size: 10px; font-weight: 900; color: #3A2A14; text-shadow: 0 1px 0 rgba(255,255,255,.7); white-space: nowrap; }
.wheel-hub .ico { width: 1.2em; height: 1.2em; }

/* ── переключатель Деревня / Зоопарк ── */
.vseg .zoo.on { background: var(--orange); box-shadow: 0 3px 0 var(--orange-d); color: #fff; }
/* ── зоопарк ── */
.zlock { text-align: center; }
.zlock h3 { color: var(--ink); text-shadow: none; margin: 6px 0; }
.zlock p { margin: 0 0 10px; font-size: 14px; }
.zgate { font-size: 84px; line-height: 0; margin: 8px 0; }
.zpreview { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; font-size: 38px; margin-top: 10px; }
.zpreview span { line-height: 0; filter: grayscale(1) brightness(.9); opacity: .45; }
.zhead { text-align: center; background: linear-gradient(#FFFDF5, #FFF1D6); }
.zrate { display: flex; justify-content: center; gap: 4px; font-size: 26px; margin-bottom: 6px; }
.zstar { line-height: 0; filter: grayscale(1); opacity: .3; }
.zstar.on { filter: none; opacity: 1; animation: pop .5s ease; }
.zcash { display: grid; justify-items: center; gap: 2px; margin-bottom: 12px; }
.zcl { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.zcash b { font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
.zcash small { color: var(--muted); font-size: 13px; }
.zpath { position: relative; height: 70px; margin: 14px 0; border-radius: 18px; border: 3px solid #fff; overflow: hidden;
  background: linear-gradient(transparent 58%, #D9B27A 58%, #D9B27A 82%, transparent 82%), var(--deco-blades), linear-gradient(var(--grass), var(--grass-2));
  background-size: auto, 90px 66px, auto; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
.zgate2 { position: absolute; left: 8px; bottom: 6px; font-size: 56px; line-height: 0; z-index: 2; }
.walker { position: absolute; bottom: 14px; left: 0; font-size: 28px; line-height: 0; animation: walk 12.8s linear infinite; }
.walker .ico { animation: step .5s ease-in-out infinite alternate; }
@keyframes walk { from { transform: translateX(50px); } to { transform: translateX(calc(100vw - 40px)); } }
@keyframes step { from { transform: translateY(0) rotate(-4deg); } to { transform: translateY(-3px) rotate(4deg); } }
.zgrid { display: grid; gap: 12px; }
.encl { display: grid; grid-template-columns: 112px 1fr; gap: 12px; align-items: stretch; background: var(--surface); border: 3px solid var(--edge);
  border-radius: 20px; padding: 10px; box-shadow: inset 0 2px 0 var(--hi), 0 5px 0 var(--edge); }
.pen-bg { position: relative; border-radius: 14px; overflow: hidden; display: grid; place-items: center; min-height: 104px;
  background: repeating-linear-gradient(90deg, transparent 0 16px, rgba(139, 90, 43, .55) 16px 19px) bottom / 100% 26px no-repeat,
    linear-gradient(transparent 70%, rgba(139, 90, 43, .55) 70%, rgba(139, 90, 43, .55) 74%, transparent 74%), var(--deco-blades), linear-gradient(#A9DE72, #7CC24A);
  background-size: 100% 26px, auto, 90px 66px, auto; border: 3px solid #fff; }
.za { font-size: 64px; line-height: 0; position: relative; z-index: 1; }
.encl.fed .za .ico { animation: zhappy 1.6s ease-in-out infinite; }
.encl.hungry .za .ico { animation: sad 3s ease-in-out infinite; filter: saturate(.7); }
@keyframes zhappy { 0%, 100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-6px) rotate(-4deg); } 60% { transform: translateY(0) rotate(3deg); } }
.za.ghost { filter: grayscale(1) brightness(1.05); opacity: .35; }
.zplus { position: absolute; z-index: 2; font-size: 36px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
.hearts { position: absolute; left: 0; right: 0; bottom: 40%; z-index: 2; pointer-events: none; }
.hearts i { position: absolute; color: #F2434B; font-style: normal; font-size: 14px; opacity: 0; animation: heart 2.4s ease-out infinite; }
.hearts i:nth-child(1) { left: 22%; } .hearts i:nth-child(2) { left: 50%; animation-delay: .8s; } .hearts i:nth-child(3) { left: 72%; animation-delay: 1.6s; }
@keyframes heart { 0% { transform: translateY(0) scale(.5); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-46px) scale(1.2); opacity: 0; } }
.zz { position: absolute; right: 8px; top: 6px; font-size: 22px; line-height: 0; z-index: 2; animation: twinkle 2s ease-in-out infinite; opacity: 1; }
.elvl { position: absolute; left: 6px; top: 4px; z-index: 2; font-size: 12px; color: #FFD23F; text-shadow: 0 1px 0 #4A2E1A, 0 0 2px #4A2E1A; letter-spacing: 1px; }
.einfo { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.einfo b { font-weight: 900; font-size: 16px; }
.einfo small { font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.einfo .row { margin-top: auto; gap: 6px; }
.einfo .row .btn, .einfo > .btn { flex: 1 1 auto; padding: 8px 8px; font-size: 13px; margin-top: 6px; }
.encl.locked { opacity: .75; }
.encl.fed { border-color: var(--green); box-shadow: inset 0 2px 0 var(--hi), 0 5px 0 var(--green-d); }
/* ── панорама фермы ── */
.pano { position: relative; height: 150px; margin-bottom: 14px; border-radius: 22px; border: 4px solid #fff; overflow: hidden;
  background: radial-gradient(circle at 88% 22%, #FFE27A 0 16px, rgba(255, 226, 122, .35) 17px 30px, transparent 31px), linear-gradient(#7FC3EC, #F6E7C8 80%);
  box-shadow: 0 5px 0 rgba(0,0,0,.15); }
.pcloud { position: absolute; top: 10px; width: 70px; animation: drift 60s linear infinite; animation-delay: -20s; }
.phills { position: absolute; left: 0; bottom: 0; width: 100%; height: 100px; }
.pi { position: absolute; bottom: 30px; transform: translateX(-50%); line-height: 0; z-index: 2; }
.pi .ico, .pet .ico, .pvil .ico, .pzoo .ico { width: 100%; height: auto; aspect-ratio: 1; display: block; }
.pi .ico svg { filter: drop-shadow(0 3px 0 rgba(74, 46, 26, .25)); }
.pi.front { bottom: 6px; z-index: 4; }
.pi.ghost { opacity: .38; filter: grayscale(1); }
.pi.ghost b { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); white-space: nowrap; font-size: 11px; font-weight: 900; line-height: 1.4;
  background: #fff; color: #3A2A14; border-radius: 999px; padding: 1px 8px; border: 2px solid var(--edge); filter: none; }
.pi.just { animation: buildIn .9s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes buildIn { 0% { transform: translateX(-50%) translateY(40px) scale(.2); opacity: 0; } 100% { transform: translateX(-50%); } }
.mill { position: relative; display: block; }
.mill .blades { position: absolute; left: 50%; top: 30%; width: 104%; transform: translate(-50%, -50%); }
.mill .blades .ico { animation: spin 7s linear infinite; }
.pet { position: absolute; bottom: 4px; width: calc(30px * var(--s, 1)); z-index: 5; line-height: 0; animation: graze 5s ease-in-out infinite; }
@keyframes graze { 0%, 100% { transform: translateX(0) scaleX(1); } 45% { transform: translateX(14px) scaleX(1); } 50% { transform: translateX(14px) scaleX(-1); } 95% { transform: translateX(0) scaleX(-1); } }
.pvil { position: absolute; right: 4%; bottom: 72px; display: flex; gap: 0; z-index: 1; opacity: .9; }
.pvil span { width: 20px; margin-left: -4px; line-height: 0; }
.pzoo { position: absolute; left: 3%; bottom: 68px; width: 30px; z-index: 1; line-height: 0; }
.pcap { position: absolute; left: 8px; top: 8px; z-index: 6; background: rgba(255, 255, 255, .9); border-radius: 12px; padding: 3px 10px; line-height: 1.25; border: 2px solid var(--edge); }
.pcap b { display: block; font-size: 13px; font-weight: 900; color: #3A2A14; }
.pcap span { font-size: 11px; color: #7A6F55; font-weight: 800; }
/* ── окно нового уровня ── */
.lv-art { position: relative; height: 170px; overflow: hidden; border-bottom: 4px solid #fff; background: linear-gradient(#8FD8FF, #5BC236 120%); }
.lv-star { position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%); z-index: 3; font-size: 120px; line-height: 0; animation: evpopin .7s .3s cubic-bezier(.3, 1.6, .5, 1) both; }
.lv-star b { position: absolute; left: 50%; top: 54%; transform: translate(-50%, -50%); font-size: 40px; font-weight: 900; color: #fff; line-height: 1; text-shadow: 0 3px 0 #C98A12, 0 0 4px #A86A0A; }
.lv-un { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin-bottom: 14px; }
.lv-u { background: var(--surface-2); border-radius: 14px; padding: 8px 4px; display: grid; justify-items: center; gap: 2px; animation: evrise .45s ease both; }
.lv-u:nth-child(2) { animation-delay: .1s; } .lv-u:nth-child(3) { animation-delay: .2s; } .lv-u:nth-child(4) { animation-delay: .3s; }
.lv-u span { font-size: 40px; line-height: 0; margin: 6px 0; }
.lv-u b { font-size: 13px; font-weight: 900; } .lv-u small { font-size: 11px; color: var(--muted); }

/* ── чёткость, аккуратность, плавность ── */
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
body { background-attachment: scroll !important; }
.ico svg { shape-rendering: geometricPrecision; }
.logo { image-rendering: auto; }
/* без размытия фона под окнами: на телефонах это тормозит */
.evpop { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; background: rgba(30, 20, 10, .62); }
/* у прыгающих картинок убираем «живые» тени: телефону не нужно пересчитывать их каждый кадр */
.plot .crop .ico svg, .ae .ico svg, .za .ico svg, .pet .ico svg, .mill .ico svg, .ev-i .ico svg, .walker .ico svg { filter: none !important; }
.plot .crop, .ae, .za, .pet, .walker, .cloud, .pcloud, .leaves > span, .duck, .wheel-svg { will-change: transform; }
.plot.ready .crop { animation-duration: 1.6s; }
/* единый ритм отступов */
main > .card, main > .list, main > .row, main > .stalls, main > .shop, main > .zgrid { margin-bottom: 14px; }
.h3row { margin: 22px 0 10px; }
.card { padding: 14px; border-radius: 20px; }
.btn { letter-spacing: .1px; }
/* подсказки можно закрыть */
.hint { position: relative; padding-right: 38px; }
.hint-x { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; border: 0; padding: 0;
  background: var(--surface-2); color: var(--muted); font-size: 13px; font-weight: 900; line-height: 26px; }
.hint-x:active { transform: scale(.88); }
.hint.bye { animation: hintBye .3s ease forwards; }
@keyframes hintBye { to { opacity: 0; transform: scale(.94); } }

.zneed { margin-top: 4px; }
.zneed .chip { font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.zprog { height: 10px; margin: 2px 0 2px; }
.zup { margin-top: 8px; grid-column: 1 / -1; }
.encl { grid-template-columns: 112px 1fr; }
.encl > .einfo + .zup, .encl .zup { grid-column: 1 / -1; }
.zup summary { cursor: pointer; font-weight: 900; font-size: 14px; color: var(--blue-d); list-style: none; padding: 6px 2px; }
.zup summary::-webkit-details-marker { display: none; }
.zup summary::after { content: " ▾"; }
.zup[open] summary::after { content: " ▴"; }
.zup .recipe { margin: 6px 0 8px; font-size: 12px; }
.encl { align-items: start; }
.pen-bg { height: 112px; }
.zmax { grid-column: 1 / -1; color: var(--green-d); font-weight: 900; font-size: 12.5px; }

/* ── событие «Джунгли» ── */
.jg-banner { position: relative; overflow: hidden; background: linear-gradient(135deg, #0F5A2E, #2E9A3E 55%, #9BD44A); color: #fff;
  border: 3px solid #fff; border-radius: 22px; padding: 14px 16px; box-shadow: 0 5px 0 #0A3F20; margin-bottom: 14px; }
.jg-banner h3 { color: #fff; font-size: 24px; margin: 0 0 4px; text-shadow: 0 3px 0 #0A3F20; }
.jg-banner p { margin: 0 0 10px; font-size: 14px; max-width: calc(100% - 64px); }
.jg-banner .deco { position: absolute; right: 4px; top: 2px; font-size: 64px; line-height: 0; animation: wiggle 3.6s ease-in-out infinite; transform-origin: 50% 100%; }
.au-pill.jgp { background: #0A4A26; box-shadow: 0 3px 0 #062E17; }
.jgbar { border-color: #9FD46A; box-shadow: inset 0 2px 0 var(--hi), 0 5px 0 #5BA032; }
.jgbar .aubar { border-color: #9FD46A; }
.jgbar .aubar > i { background: repeating-linear-gradient(-45deg, #3E9A2E 0 10px, #6CCB4A 10px 20px); }
.jgcard { border-color: #7FBF4A; box-shadow: inset 0 2px 0 var(--hi), 0 5px 0 #4E8A2A; background: linear-gradient(#F4FBEA, #E4F3D2); color: #22381A; }
.jtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.jtop b { display: block; font-size: 17px; font-weight: 900; }
.jtop small { color: #557040; font-size: 12.5px; }
.jboard { display: grid; gap: 6px; padding: 10px; border-radius: 18px; background:
  radial-gradient(circle at 15% 20%, rgba(255,255,255,.15) 0 30px, transparent 31px), radial-gradient(circle at 85% 70%, rgba(0,0,0,.08) 0 40px, transparent 41px),
  var(--deco-blades), linear-gradient(#2E7A2E, #1F5A22); background-size: auto, auto, 90px 66px, auto; border: 3px solid #fff; }
.jrow { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.jc { position: relative; aspect-ratio: 1; border-radius: 12px; background: linear-gradient(#E8C98E, #C9A060); border: 2px solid #8B5A2B;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.4), 0 3px 0 rgba(0,0,0,.25); display: grid; place-items: center; font-size: 26px; line-height: 0; }
.jc > .ico { width: 1em; height: 1em; }
.jc .jn { position: absolute; left: 3px; top: 2px; font-size: 9px; line-height: 1; font-weight: 900; color: rgba(74,46,26,.55); }
.jc .jst { font-size: 10px; line-height: 1.1; color: #4A2E1A; font-weight: 900; }
.jc.t-snake { background: linear-gradient(#F2B8A8, #D98270); }
.jc.t-liana { background: linear-gradient(#C8EBA0, #8FCB5A); }
.jc.t-swamp { background: linear-gradient(#A8B88A, #7A8A5A); }
.jc.t-chest, .jc.t-star { background: linear-gradient(#FFE89A, #F2C23A); }
.jc.t-temple { background: linear-gradient(#E0D8B0, #B8B08A); border-color: #6B6A4A; font-size: 32px; box-shadow: inset 0 2px 0 rgba(255,255,255,.4), 0 3px 0 rgba(0,0,0,.25), 0 0 0 3px #FFD23F; }
.jc.past { filter: saturate(.35) brightness(.88); opacity: .75; }
.jc .tok { position: absolute; left: 50%; bottom: 18%; transform: translateX(-50%); z-index: 3; font-size: 30px; line-height: 0; filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)); animation: tokIdle 1.4s ease-in-out infinite; }
.jc .tok.hop { animation: tokHop .23s ease-out, tokIdle 1.4s .23s ease-in-out infinite; }
@keyframes tokIdle { 50% { transform: translateX(-50%) translateY(-4px); } }
@keyframes tokHop { 0% { transform: translateX(-50%) translateY(0) scale(.8); } 50% { transform: translateX(-50%) translateY(-14px) scale(1.1); } 100% { transform: translateX(-50%) translateY(0); } }
.jmsg { margin: 12px 0; padding: 10px 12px; border-radius: 14px; background: #fff; font-size: 14px; font-weight: 800; line-height: 1.35; min-height: 44px; }
.jroll { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.dice { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(#FFFFFF, #EDE6D6); border: 3px solid #4A2E1A; box-shadow: 0 4px 0 #4A2E1A;
  display: grid; grid-template-columns: repeat(3, 1fr); padding: 7px; gap: 2px; }
.dice i { border-radius: 50%; margin: 2px; }
.dice i.on { background: radial-gradient(circle at 40% 35%, #6A4A3A, #2A1A12); }
.dice.rolling { animation: diceRoll .56s linear; }
@keyframes diceRoll { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(200deg) scale(1.15); } 100% { transform: rotate(360deg) scale(1); } }
.jlegend { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 12px; font-size: 12px; color: #557040; font-weight: 800; }
.jlegend span { display: inline-flex; align-items: center; gap: 3px; }
.jlegend .ico { width: 1.4em; height: 1.4em; }
.scard.jg { background: linear-gradient(#FFFFFF, #EAF6DD); border-color: #9FD46A; box-shadow: 0 5px 0 #5BA032; }
.scard.jg small { color: #4E7030; }
.jg-art { background: radial-gradient(circle at 82% 20%, #FFF2A0 0 22px, rgba(255, 242, 160, .32) 23px 40px, transparent 41px), linear-gradient(#9BE0F5, #4CB944 70%, #1F7A2A); }
.seed.ev.jgs { border-color: #9FD46A; background: #EAF6DD; box-shadow: 0 4px 0 #5BA032; }

function newState() {
  return { coins: START_COINS, xp: 0, plots: Array.from({ length: START_PLOTS }, () => ({ crop: null, planted: 0 })),
           inv: {}, factories: {}, animals: {}, lastBonus: 0, seed: "wheat", savedAt: 0,
           stats: { harvested: 0, earned: 0, pests: 0, doubles: 0, quests: 0, fish: 0, golden: 0, apples: 0, games: 0, bestApples: 0, bestPairs: 0, dug: 0 }, ach: {}, daily: null, au: null, unlocks: {}, village: {}, album: {}, colls: {}, zoo: null, panoSeen: 0 };
}
function normalize(s) {
  const d = newState();
  if (!s || typeof s !== "object") return d;
  const n = { ...d, ...s, inv: { ...(s.inv || {}) }, factories: { ...(s.factories || {}) }, animals: { ...(s.animals || {}) },
              stats: { ...d.stats, ...(s.stats || {}) }, ach: { ...(s.ach || {}) }, village: { ...(s.village || {}) },
              album: { ...(s.album || {}) }, colls: { ...(s.colls || {}) }, unlocks: { ...(s.unlocks || {}) }, au: s.au || null, zoo: s.zoo || null,
              plots: Array.isArray(s.plots) && s.plots.length ? s.plots : d.plots };
  // убираем всё, чего больше нет в игре (например, старые ивенты)
  delete n.hw; delete n.stats.lily;
  for (const k of Object.keys(n.inv)) if (!ITEMS[k]) delete n.inv[k];
  n.plots = n.plots.map(p => p.crop && !CROPS[p.crop] ? { crop: null, planted: 0 } : p);
  for (const k of Object.keys(n.factories)) if (!FACTORIES[k]) delete n.factories[k];
  for (const k of Object.keys(n.album)) if (k.startsWith("m:") || (!k.startsWith("a:") && !ITEMS[k])) delete n.album[k];
  for (const k of Object.keys(n.ach)) if (!ACH.some(a => a.id === k)) delete n.ach[k];
  for (const k of Object.keys(n.colls)) if (!ALBUM.some(c => c.id === k)) delete n.colls[k];
  if (!CROPS[n.seed]) n.seed = "wheat";
  return n;
}

function fmt(sec) {
  sec = Math.max(0, Math.ceil(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  if (h) return `${h}ч ${m}м`;

  return `${s}с`;
}

    const rr = r + dr, cc = c + dc;
    if (rr >= 0 && rr < 5 && cc >= 0 && cc < 5 && cells[rr * 5 + cc] === "hog") n++;
  }
  return n;
}
function auBank(rd, note) {
  const a = S.au, L = rd.loot;
  a.coins += L.coins; auAddPoints(L.points);
  for (const [k, v] of Object.entries(L.seeds)) a.seeds[k] = (a.seeds[k] || 0) + v;
  rd.over = true;
  a.last = { coins: L.coins, points: L.points, seeds: { ...L.seeds }, note };
}

function ensureDaily() {
  const day = todayKey();
  if (S.daily && S.daily.day === day && S.daily.v === 2) return false;
  const r = mkRng(hash("day:" + day)), lvl = levelOf();
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const ok = t => !QUESTS[t].need || QUESTS[t].need(S);
  const games = shuffle(Object.keys(QUESTS).filter(t => QUESTS[t].game));
  const rest = shuffle(Object.keys(QUESTS).filter(t => !QUESTS[t].game && ok(t)));
  const types = [games[0], rest[0], rest[1]];
  S.daily = { day, v: 2, quests: types.map(type => ({ type, ...QUESTS[type].make(r, lvl), progress: 0, claimed: false,
                                                            coins: 60 + 40 * lvl, xp: 15 + 5 * lvl })) };
  return true;
}
function track(type, n, item) {
  if (!S.daily) return;
  for (const q of S.daily.quests)
    if (q.type === type && !q.claimed && (!q.item || q.item === item)) q.progress = Math.min(q.target, q.progress + n);
}
const built = id => !!(S.village && S.village[id]);
const maxPlots = () => MAX_PLOTS + (built("bridge") ? 2 : 0);
function entryOf(k) {
  if (k.startsWith("a:")) return ANIMALS[k.slice(2)];
  if (k.startsWith("z:")) return ZOO.find(z => z.id === k.slice(2));
  return ITEMS[k];
}
function albumScan() {
  for (const [k, v] of Object.entries(S.inv)) if (v > 0) S.album[k] = 1;
  for (const [t, l] of Object.entries(S.animals)) if (l.length) S.album["a:" + t] = 1;
  for (const c of ALBUM) if (!S.colls[c.id] && c.keys.every(k => S.album[k])) {
    S.colls[c.id] = Date.now(); S.coins += c.reward;
    pendingToasts.push([`📚 Коллекция «${c.name}» собрана! +${num(c.reward)}💰`, "lvl"]);
  }
}
function checkAch() {
  albumScan();
  auMiles();
  for (const a of ACH) if (!S.ach[a.id] && a.test(S)) {
    S.ach[a.id] = Date.now(); S.coins += a.reward;
    pendingToasts.push([`🏅 Достижение «${a.name}»! +${a.reward}💰`, "lvl"]);
  }
}

let cloud = { db: null, uid: null, user: null, timer: null, writing: false, again: false, lastLb: "" };
function persist() {
  S.savedAt = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
  scheduleCloud();
}
function scheduleCloud() {
  if (!cloud.db || !cloud.uid) return;
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(flushCloud, 2500);
}
async function flushCloud() {
  if (cloud.writing) { cloud.again = true; return; }
  cloud.writing = true;
  try {
    await cloud.db.doc(`data/users/${cloud.uid}/save`).set({ state: JSON.parse(JSON.stringify(S)) });
    const lb = { coins: S.coins, level: levelOf(), xp: S.xp };
    const key = JSON.stringify(lb);
    if (key !== cloud.lastLb) {
      await cloud.db.doc(`leaderboard/${cloud.uid}`).set({ ...lb, updatedAt: Date.now() });
      cloud.lastLb = key;
    }
  } catch (e) { /* сохранится локально */ }
  cloud.writing = false;
  if (cloud.again) { cloud.again = false; scheduleCloud(); }
}

function plantOn(p, crop, t) {
  const c = CROPS[crop];
  const dur = Math.round(c.time * (evIs("rain") ? 0.66 : evIs("drought") ? 1.5 : 1) * (built("well") ? 0.9 : 1));
  p.crop = crop; p.planted = t; p.dur = dur; p.pestGone = false;
  p.pestAt = Math.random() < (evIs("bugs") ? 0.5 : 0.25) * (built("club") ? 0.5 : 1) ? t + dur * (0.2 + Math.random() * 0.6) : 0;
  track("plant", 1);
}
function harvestPlot(p) {
  const c = CROPS[p.crop];
  let y = c.yield, bug = false, dbl = false;
  if (pestActive(p)) { y = Math.max(1, Math.floor(y / 2)); bug = true; }
  else if (Math.random() < (evIs("luck") ? 0.35 : 0.1)) { y *= 2; dbl = true; S.stats.doubles++; }
  S.inv[p.crop] = (S.inv[p.crop] || 0) + y;
  S.stats.harvested += y;
  track("harvest", y, p.crop);
  addXp(c.xp);
  const crop = p.crop;
  { const e = CROPS[crop].event; if (e && evActive(e)) (e === "jungle" ? jgAddPoints : auAddPoints)(y * 2); }
  Object.assign(p, { crop: null, planted: 0, dur: 0, pestAt: 0, pestGone: false });
  return { crop, y, bug, dbl, xp: c.xp };
}
function feedAnimal(type, a) {
  const an = ANIMALS[type];
  if (!hasAll(an.feed)) return false;
  take(an.feed); a.end = now() + an.time; return true;
}
function collectAnimal(type, a) {
  const an = ANIMALS[type], [item, q] = an.product;
  S.inv[item] = (S.inv[item] || 0) + q;
  a.end = 0; addXp(an.xp); track("animal", q);
  return q;
}

  animAfterAction();
  flushToasts();
});

let toastTimer;
function toast(msg, kind = "") {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast show " + kind;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = "toast " + kind, kind === "lvl" ? 3200 : 2200);
}
function flushToasts() {
  if (lvlUpQueue) { const n = lvlUpQueue; lvlUpQueue = 0; setTimeout(() => showLevelUp(n), 650); }
  pendingToasts.forEach(([m, k], i) => setTimeout(() => toast(m, k), 1300 + i * 3300));
  pendingToasts = [];
}
function bumpCoins() {
  const c = document.getElementById("coins");
  c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop");
}
