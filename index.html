function tick(fromRender) {
  if (auRegen()) { persist(); if (tab === "events" && !wheelBusy) return render(); }
  if (jgActive() && jgRegen()) { persist(); if (tab === "events" && !jgBusy) return render(); }
  if (!fromRender && !wheelBusy && !jgBusy && signature() !== lastSig) return render();
  const t = now();
  document.querySelectorAll("[data-plot]").forEach(el => {
    const p = S.plots[+el.dataset.plot];
    const crop = el.querySelector(".crop"), tag = el.querySelector(".tag"), pest = el.querySelector(".pest");
    if (!p.crop) { el.className = "plot empty"; el.style.setProperty("--p", 0); crop.textContent = ""; crop.dataset.k = ""; pest.textContent = ""; tag.textContent = "пусто"; return; }
    const dur = plotDur(p), prog = Math.min(1, (t - p.planted) / dur), ready = prog >= 1, bug = pestActive(p);
    el.className = "plot" + (ready ? " ready" : "") + (bug ? " bug" : "");
    el.style.setProperty("--p", prog.toFixed(3));
    const ck = prog < 0.3 ? "sprout" : p.crop; if (crop.dataset.k !== ck) { const had = crop.dataset.k !== undefined && crop.dataset.k !== ""; crop.dataset.k = ck; crop.innerHTML = icon(ck); if (had || p.planted > now() - 2) { crop.classList.remove("grow"); void crop.offsetWidth; crop.classList.add("grow"); } }
    pest.textContent = bug ? "🐛" : "";
    tag.textContent = bug && !ready ? "Жук!" : ready ? (bug ? "Собрать (жук!)" : "Собрать") : fmt(p.planted + dur - t);
  });
  document.querySelectorAll("[data-animal]").forEach(el => {
    const [type, i] = el.dataset.animal.split(":"), a = (S.animals[type] || [])[+i];
    if (!a) return;
    const an = ANIMALS[type], st = animalState(a), tag = el.querySelector(".tag");
    el.className = "animal " + st;
    el.querySelector(".bar").style.width = st === "working" ? Math.min(100, (1 - (a.end - t) / an.time) * 100) + "%" : "0";
    tag.textContent = st === "hungry" ? "Кормить" : st === "ready" ? "Забрать" : fmt(a.end - t);
  });
  document.querySelectorAll("[data-fac]").forEach(el => {
    const f = S.factories[el.dataset.fac];
    if (f && f.job && !facDone(f)) el.textContent = `⏳ Работает, осталось ${fmt(f.job.end - t)} · партий: ${f.job.batches}`;
  });
  document.querySelectorAll("[data-facbar]").forEach(el => {
    const f = S.factories[el.dataset.facbar];
    if (f && f.job) { const st = f.job.start || (f.job.end - batchTime(el.dataset.facbar, f.level) * f.job.batches);
      el.style.width = Math.min(100, (t - st) / (f.job.end - st) * 100) + "%"; }
  });
  const cd = document.querySelector("[data-countdown]");
  if (cd) cd.textContent = `Новые цены через ${fmt(3600 - t % 3600)}`;
  const zc = document.querySelector("[data-zcash]");
  if (zc && S.zoo) zc.innerHTML = `${icon("coin")} ${num(Math.floor(zooPending()))}`;
  document.querySelectorAll("[data-zfed]").forEach(el => { const a = S.zoo && S.zoo.animals[el.dataset.zfed]; if (a && zooFed(a)) el.textContent = `Сыты ещё ${fmt(a.fedUntil - t)}`; });
  const jc = document.querySelector("[data-jgcd]");
  if (jc) jc.textContent = `⏳ ${fmtLong(JUNGLE.end - t)}`;
  const je = document.querySelector("[data-jgen]");
  if (je && S.jg) je.textContent = `🎲 ${S.jg.moves}/${jgMaxM()}` + (S.jg.moves < jgMaxM() ? ` · +1 через ${fmt(S.jg.mAt + JG_REGEN - t)}` : "");
  const ac = document.querySelector("[data-aucd]");
  if (ac) ac.textContent = `⏳ ${fmtLong(AUTUMN.end - t)}`;
  const ae = document.querySelector("[data-auen]");
  if (ae && S.au) ae.textContent = `🧺 ${S.au.energy}/${auMaxE()}` + (S.au.energy < auMaxE() ? ` · +1 через ${fmt(S.au.eAt + AU_REGEN - t)}` : "");
  const ev = document.querySelector("[data-evcd]");
  if (ev) ev.textContent = fmt((evWindow() + 1) * EVENT_LEN - t);
  document.getElementById("bonusBtn").classList.toggle("ready", S.lastBonus + 86400 <= t);
  const nb = VILLAGE.find(b => !built(b.id));
  const dots = {
    village: (!!nb && S.coins >= nb.coins && hasAll(nb.need)) || (zooOpen() && zooPending() >= 100),
    farm: S.plots.some(p => plotReady(p) || pestActive(p)),
    animals: Object.values(S.animals).some(l => l.some(a => animalState(a) === "ready")),
    ind: Object.values(S.factories).some(facDone),
    events: (jgActive() && (!S.jg || S.jg.moves >= jgMaxM())) || auActive() && (wheelFree() || !S.au || (S.au.energy >= auMaxE() && !(S.au.round && !S.au.round.over))),
    quests: !!S.daily && S.daily.quests.some(q => !q.claimed && q.progress >= q.target),
  };
  document.querySelectorAll(".tab, .logo-btn").forEach(tb => {
    const want = dots[tb.dataset.arg] && tab !== tb.dataset.arg, dot = tb.querySelector(".dot");
    if (want && !dot) tb.insertAdjacentHTML("beforeend", '<span class="dot"></span>');
    if (!want && dot) dot.remove();
  });
}

      el.textContent = (p.name || "Фермер") + (el.dataset.name === cloud.uid ? " (ты)" : "");

// ───────── облако: сохранение между устройствами и общий рейтинг ─────────
(async () => {
  if (!window.claude || !window.claude.use) return;
  try {
    const [user, db] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    cloud.user = user;
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    cloud.db = db; cloud.uid = uid;
    try {
      const snap = await db.doc(`data/users/${uid}/save`).get();
      const remote = snap.exists ? snap.data().state : null;
      if (remote && (remote.savedAt || 0) > (S.savedAt || 0)) {
        S = normalize(JSON.parse(JSON.stringify(remote)));
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
      }
    } catch (e) {}
    db.collection("leaderboard").orderBy("coins", "desc").limit(20).onSnapshot(
      snap => { leaders = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (tab === "quests") render(); },
      () => { leaders = []; }
    );
    checkAch();
    render();
    scheduleCloud();
  } catch (e) {}
})();

// 🍎 Яблоневый сад
const AppleGame = {
  open() {
    setOv("🍎 Яблоневый сад", "30 секунд");
    ovBody().innerHTML = `<canvas class="game" id="cv"></canvas>
      <div class="result"><div class="card"><div class="big">🧺</div><h4>Лови яблоки!</h4>
      <p>Води пальцем по экрану, корзина поедет следом. 🍎 — одно яблоко, 🍏 — сразу два.</p>
      <p>Поймай 10 подряд без промахов, и яблоки будут считаться ×2. 🐝 Пчела отнимает 3 яблока.</p>
      <button class="btn primary big" data-g="start" style="width:100%">Начать</button></div></div>`;
    this.setup(); this.draw();
  },
  setup() {
    const cv = document.getElementById("cv"), dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    this.cv = cv; this.ctx = cv.getContext("2d"); this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.w = r.width; this.h = r.height; this.bx = this.w / 2; this.bg = null;
    this.objs = []; this.fx = []; this.n = 0; this.streak = 0; this.left = 30; this.running = false; this.spawn = 0; this.shake = 0;
    const move = e => { const rr = cv.getBoundingClientRect(); this.bx = Math.max(30, Math.min(this.w - 30, e.clientX - rr.left)); };
    cv.addEventListener("pointerdown", move); cv.addEventListener("pointermove", move);
    this.key = e => { if (e.key === "ArrowLeft") this.bx = Math.max(30, this.bx - 34); if (e.key === "ArrowRight") this.bx = Math.min(this.w - 30, this.bx + 34); };
    window.addEventListener("keydown", this.key);
  },
  on(g, b) { if (g === "start") { b.closest(".result").remove(); this.start(); } },
  start() {
    this.running = true; this.last = performance.now();
    const loop = t => { if (!this.running) return; this.step(Math.min(0.05, (t - this.last) / 1000)); this.last = t; if (this.running) this.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
  },
  mult() { return this.streak >= 10 ? 2 : 1; },
  step(dt) {
    this.left -= dt;
    const prog = Math.min(1, 1 - this.left / 30);
    this.spawn -= dt;
    if (this.spawn <= 0 && this.left > 0.6) {
      this.spawn = 0.8 - 0.25 * prog;
      const r = Math.random();
      const type = r < 0.24 + 0.12 * prog ? "bee" : r < 0.31 + 0.12 * prog ? "green" : "apple";
      this.objs.push({ type, x: 30 + Math.random() * (this.w - 60), y: 60, vy: 170 + 170 * prog + Math.random() * 60, ph: Math.random() * 6 });
    }
    const by = this.h - 60;
    for (const o of this.objs) {
      o.y += o.vy * dt;
      if (o.type === "bee") { o.ph += dt * 4; o.x = Math.max(16, Math.min(this.w - 16, o.x + Math.cos(o.ph) * 100 * dt)); }
      if (!o.dead && o.y > by - 32 && o.y < by + 16 && Math.abs(o.x - this.bx) < 46) {
        o.dead = true;
        if (o.type === "bee") { this.n = Math.max(0, this.n - 3); this.streak = 0; this.shake = 0.3; this.fx.push({ x: o.x, y: by - 40, t: 0, txt: "−3", c: "#FF5A4E" }); if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {} }
        else { const v = (o.type === "green" ? 2 : 1) * this.mult(); this.n += v; this.streak++; this.fx.push({ x: o.x, y: by - 40, t: 0, txt: "+" + v, c: "#FFFFFF" }); }
      }
      if (!o.dead && o.y > this.h + 20) { o.dead = true; if (o.type !== "bee") this.streak = 0; }
    }
    this.objs = this.objs.filter(o => !o.dead);

async function jgLand(note) {

  if (t === "temple") {

    toast(`🛕 Ты дошёл до храма! +${gems} самоцветов, +${num(coins)}💰 и семя дуриана`, "lvl");
    await sleep(1400);

    return;
  }
  if (c.gems) { const n = Math.round(c.gems * mult); g.gems += n; jgAddPoints(n + (c.pts || 0)); cellFloat(i, `+${n} ${icon("gem")}`); msg += `${c.name}: +${n} самоцветов.`; }
  else if (t === "star") { const n = Math.round((120 + g.trail * 40) * mult); S.coins += n; cellFloat(i, `+${n} ${icon("coin")}`); msg += `Золотой знак: +${n} монет.`; }
  else if (t === "seed") {
    const v = Math.random(), k = v < .6 ? "banana" : v < .9 ? "pineapple" : "durian";
    g.seeds[k] = (g.seeds[k] || 0) + 1; cellFloat(i, `+1 ${icon(k)}`); msg += `Нашлось семя: ${CROPS[k].name}!`;
  }
  else if (t === "swamp") { g.swamp = true; msg += "Болото! Следующий бросок будет на 2 шага короче."; cellFloat(i, `${icon("zzz")}`, true); }
  else if (t === "snake") {

    else { msg += "Змея! Отступаешь на 3 клетки назад."; cellFloat(i, `−3 ${icon("snake")}`, true); await sleep(500); await walk(i, Math.max(0, i - 3)); }
  }

    await sleep(450); await walk(i, to);

const JA = {
  jgRoll() { jgRoll(); return "keep"; },
  jgBuyM() { const g = jgState(); if (S.coins < JG_BUY) return toast(`Нужно ${JG_BUY}💰`, "err"); S.coins -= JG_BUY; g.moves++; toast("🎲 +1 ход"); },
